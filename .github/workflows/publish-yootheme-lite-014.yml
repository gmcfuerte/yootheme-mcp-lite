name: Publish YOOtheme Lite 0.1.4 metadata

on:
  workflow_dispatch:

permissions: {}

jobs:
  publish-lite:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: Install verified official publisher
        shell: bash
        run: |
          curl --fail --location --connect-timeout 15 --max-time 60 --retry 2 --output publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  publisher.tar.gz' | sha256sum --check --strict
          tar -xzf publisher.tar.gz mcp-publisher
      - name: Publish only the three reviewed public Lite definitions
        shell: python
        run: |
          import json, pathlib, subprocess, urllib.parse, urllib.request
          definitions = json.loads("[{\"$schema\":\"https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json\",\"name\":\"io.github.gmcfuerte/yootheme-mcp-lite\",\"description\":\"Limited local read-only MCP companion: GMC YOOtheme MCP Lite.\",\"title\":\"GMC YOOtheme MCP Lite\",\"repository\":{\"url\":\"https://github.com/gmcfuerte/yootheme-mcp-lite\",\"source\":\"github\"},\"version\":\"0.1.4\",\"packages\":[{\"registryType\":\"mcpb\",\"identifier\":\"https://github.com/gmcfuerte/yootheme-mcp-lite/releases/download/v0.1.4/yootheme-mcp-lite-0.1.4.mcpb\",\"fileSha256\":\"2d656132ad3e4c6ec061e4ff9c38ffb395e57f10b3dbedf364ba120e1e072317\",\"transport\":{\"type\":\"stdio\"}}]}]")
          registry = 'https://registry.modelcontextprotocol.io'
          receipts = []
          try:
              login = subprocess.run(['./mcp-publisher', 'login', 'github-oidc', '--registry', registry], capture_output=True, timeout=60)
              if login.returncode:
                  raise RuntimeError('OIDC login failed')
              for index, server in enumerate(definitions):
                  item = {'name': server['name'], 'version': server['version'], 'confirmed': False}
                  receipts.append(item)
                  path = pathlib.Path('server-' + str(index) + '.json')
                  path.write_text(json.dumps(server), encoding='utf-8')
                  validation = subprocess.run(['./mcp-publisher', 'validate', '--file', str(path)], capture_output=True, timeout=60)
                  item['validation_success'] = validation.returncode == 0
                  if validation.returncode:
                      raise RuntimeError('Registry metadata validation failed')
                  publication = subprocess.run(['./mcp-publisher', 'publish', str(path)], capture_output=True, timeout=60)
                  item['publication_success'] = publication.returncode == 0
                  if publication.returncode:
                      raise RuntimeError('Registry publication failed')
                  url = registry + '/v0.1/servers/' + urllib.parse.quote(server['name'], safe='') + '/versions/' + server['version']
                  with urllib.request.urlopen(url, timeout=30) as response:
                      data = json.load(response)
                  actual = data.get('server', data)
                  item['status'] = data.get('_meta', {}).get('io.modelcontextprotocol.registry/official', {}).get('status')
                  item['hash_matches'] = actual.get('packages', [{}])[0].get('fileSha256') == server['packages'][0]['fileSha256']
                  item['confirmed'] = item['status'] == 'active' and item['hash_matches'] and actual.get('name') == server['name']
                  if not item['confirmed']:
                      raise RuntimeError('Registry readback differs')
          finally:
              subprocess.run(['./mcp-publisher', 'logout'], capture_output=True, timeout=15)
              print('LITE_REGISTRY_RECEIPTS=' + json.dumps(receipts))