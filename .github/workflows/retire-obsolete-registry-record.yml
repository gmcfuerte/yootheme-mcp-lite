name: Retire obsolete full Pro Registry record

on:
  workflow_dispatch:

permissions: {}

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: Install verified official MCP publisher
        shell: bash
        run: |
          curl --fail --location --connect-timeout 15 --max-time 60 --retry 2 --output publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  publisher.tar.gz' | sha256sum --check --strict
          tar -xzf publisher.tar.gz mcp-publisher
      - name: Retire only yootheme-mcp version 0.11.3
        shell: python
        run: |
          import json, subprocess, urllib.parse, urllib.request
          server = 'io.github.gmcfuerte/yootheme-mcp'
          version = '0.11.3'
          registry = 'https://registry.modelcontextprotocol.io'
          message = 'Full Pro package removed from PyPI. Use the separate public Lite preview: https://github.com/gmcfuerte/yootheme-mcp-lite'
          receipt = {'server': server, 'version': version, 'method': 'github-oidc', 'retirement_confirmed': False}
          stage = 'login'
          try:
              login = subprocess.run(['./mcp-publisher', 'login', 'github-oidc', '--registry', registry], capture_output=True, timeout=60)
              receipt['login_success'] = login.returncode == 0
              if login.returncode:
                  raise RuntimeError('login_failed')
              stage = 'status'
              change = subprocess.run(['./mcp-publisher', 'status', '--status', 'deleted', '--message', message, server, version], capture_output=True, timeout=60)
              receipt['status_command_success'] = change.returncode == 0
              if change.returncode:
                  raise RuntimeError('status_failed')
              stage = 'readback'
              url = registry + '/v0.1/servers/' + urllib.parse.quote(server, safe='') + '/versions/' + version
              with urllib.request.urlopen(url, timeout=30) as response:
                  data = json.load(response)
              receipt['registry_status'] = data.get('_meta', {}).get('io.modelcontextprotocol.registry/official', {}).get('status')
              receipt['retirement_confirmed'] = receipt['registry_status'] == 'deleted'
          except Exception as error:
              receipt['failure_stage'] = stage
              receipt['error_type'] = type(error).__name__
          finally:
              subprocess.run(['./mcp-publisher', 'logout'], capture_output=True, timeout=15)
          print('RETIRE_RECEIPT=' + json.dumps(receipt))
          if not receipt['retirement_confirmed']:
              raise SystemExit(1)
